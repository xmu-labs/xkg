name: CI

# Runs the checks a contributor is expected to run locally, so a PR cannot
# merge on a green Vercel deployment alone — building successfully is not the
# same as being correct.
on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks out and tests code.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the secret scan below

      # This repository is public. .gitignore keeps private files out of a
      # normal `git add`, but not out of `git add -f`; this keeps them out of main.
      # Keep the pattern in step with the "Private plans" block in .gitignore.
      - name: No private plans, notes or credentials
        run: |
          private='(^|/)(XKG|MNEMOS)_PLAN\.md$|(^|/)(CLAUDE|AGENTS)(\.local)?\.md$|\.local\.md$|^(plans|notes|memory|docs/superpowers)/|(^|/)\.(claude|codex|cursor|agents|gstack|superpowers|xkg|xmu|mnemos|aws|ssh)/|(^|/)\.env($|\.)|(^|/)\.DS_Store$'
          # Only environment templates are exempt — not any file ending in .example.
          found=$(git ls-files | grep -E "$private" | grep -vE '(^|/)\.env(\.[^/]+)?\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Private files are tracked and must be removed from this public repository:"
            echo "$found"
            exit 1
          fi

      # Scans every commit, not only the current tree: a token committed and
      # deleted later is still public in history. Pinned and checksum-verified
      # rather than a third-party action, which needs a paid licence for
      # organisation repositories.
      #
      # The policy comes from here, never from the code under test: gitleaks
      # would load a repository .gitleaks.toml or .gitleaksignore (either can
      # allowlist everything) and honour inline gitleaks:allow comments.
      - name: No secrets in history
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          policy=$(git -C "$GITHUB_WORKSPACE" ls-files | grep -E '(^|/)\.gitleaks(\.toml|ignore)$' || true)
          if [ -n "$policy" ]; then
            echo "::error::Secret-scan policy files are not accepted here; remove: $policy"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          printf '[extend]\nuseDefault = true\n' > gitleaks.toml
          ./gitleaks git --config gitleaks.toml --ignore-gitleaks-allow --log-opts="--all" --redact --no-banner "$GITHUB_WORKSPACE"
          # Commit messages are not part of any patch, so scan them separately.
          git -C "$GITHUB_WORKSPACE" log --all --format='%H%n%B' |
            ./gitleaks stdin --config gitleaks.toml --ignore-gitleaks-allow --redact --no-banner

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install`: it installs exactly the lockfile, so CI
      # can't pass on a dependency tree that no contributor actually has.
      - name: Install dependencies
        run: npm ci

      # Known high or critical advisories in what ships to users. Dev-only
      # tooling is excluded: its advisories never reach production, and
      # several are only fixable upstream (eslint-config-next). A new advisory
      # can turn this red without a code change; the fix is a dependency bump.
      - name: No known vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Lint runs here because it silently broke once and nobody noticed for a
      # day: a TypeScript major bump made typescript-eslint refuse to load, and
      # CI only ran typecheck and tests. A check a contributor runs locally but
      # CI never runs is a check that eventually stops working.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # The web app on a 320 px touch phone (Playwright, mobile Chromium): layout
  # overflow, input sizes, touch states and history. Every /api call is
  # mocked in the browser, so the job needs no database or secrets.
  ui:
    name: UI tests (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: UI tests
        run: npm run test:ui

  # Blocks a pull request that adds a dependency with a known high or critical
  # vulnerability, or under a licence outside this list. The list is every
  # licence already in the tree; copyleft licences (GPL, AGPL) are left out
  # because they are not compatible with shipping this project under MIT.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, MPL-2.0,
            LGPL-3.0-or-later, Python-2.0, CC-BY-4.0, CC0-1.0, Unlicense,
            BlueOak-1.0.0
