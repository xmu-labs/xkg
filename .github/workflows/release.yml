# Publishing a GitHub Release is the only way a version reaches npm. The
# release tag is the single source of truth: it must match package.json and
# point at a commit on main, and the workflow publishes that exact commit.
#
# Why: 1.4.0 was published by hand from a local commit that was never pushed,
# and its tag pointed at the commit before the version bump. npm, the tag and
# main each described a different state and nothing caught it.
#
# Release flow:
#   1. PR that bumps the version: `npm version minor --no-git-tag-version`
#      (updates package.json and package-lock.json). Merge it.
#   2. GitHub → Releases → Draft a new release → new tag `vX.Y.Z` on `main`
#      → Publish. Mark it as a pre-release to publish under the `next` dist-tag.
#
# While npm/cli#9969 blocks trusted publishing for this repo, publish by hand
# first, from a clean checkout of the bump commit (`npm publish --access
# public`), then do step 2: the workflow sees the version on npm with the
# tagged commit as its gitHead, skips publishing, and still verifies.
#
# Auth: npm trusted publishing (OIDC) — no long-lived token. One-time setup on
# npmjs.com → mnemos-capture → Settings → Trusted publishing → GitHub Actions,
# repository xmu-labs/xkg, workflow `release.yml`. Provenance also requires
# package.json `repository.url` to name this repository. Falls back to an
# NPM_TOKEN repository secret if trusted publishing is not configured.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      # Every check here guards against one way npm, the tag and main can
      # disagree. Fail before publishing: an npm version can never be reused.
      - name: Verify release matches the repository
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          LOCK_VERSION=$(node -p 'require("./package-lock.json").version')

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::package-lock.json is at $LOCK_VERSION, package.json at $VERSION. Bump with npm version so both move."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points at $(git rev-parse --short HEAD), which is not on main. Merge the version bump first."
            exit 1
          fi
          # Published by hand from this exact commit (npm trusted publishing
          # rejects repos renamed after 2026-07-15, npm/cli#9969): skip the
          # publish and let the last step confirm the tag and npm agree. A
          # version published from any other commit is still an error.
          if npm view "mnemos-capture@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_HEAD=$(npm view "mnemos-capture@$VERSION" gitHead 2>/dev/null || true)
            if [ "$PUBLISHED_HEAD" != "$(git rev-parse HEAD)" ]; then
              echo "::error::mnemos-capture@$VERSION is already on npm from ${PUBLISHED_HEAD:-an unknown commit}. Bump the version."
              exit 1
            fi
            echo "::notice::mnemos-capture@$VERSION was already published from this commit; skipping publish."
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # prepublishOnly builds the CLI into dist/cli.
      - name: Publish
        if: env.ALREADY_PUBLISHED != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      # Closes the loop: the published gitHead must be the tagged commit.
      - name: Verify published package
        run: |
          EXPECTED=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5 6; do
            GIT_HEAD=$(npm view "mnemos-capture@$VERSION" gitHead 2>/dev/null || true)
            [ -n "$GIT_HEAD" ] && break
            sleep 10
          done
          if [ "$GIT_HEAD" != "$EXPECTED" ]; then
            echo "::error::npm reports gitHead '$GIT_HEAD' for $VERSION, expected $EXPECTED."
            exit 1
          fi
          echo "::notice::mnemos-capture@$VERSION published as '$DIST_TAG' from $EXPECTED."
