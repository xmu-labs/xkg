# Publishing a GitHub Release is the only way a version reaches npm. The
# release tag is the single source of truth: it must match package.json and
# point at a commit on main, and the workflow publishes that exact commit.
#
# Why: 1.4.0 was published by hand from a local commit that was never pushed,
# and its tag pointed at the commit before the version bump. npm, the tag and
# main each described a different state and nothing caught it.
#
# Release flow:
#   1. PR that bumps the version: `npm version minor --no-git-tag-version`
#      (updates package.json and package-lock.json). Merge it.
#   2. GitHub → Releases → Draft a new release → new tag `vX.Y.Z`, target the
#      bump commit (Target → Recent commits, so a later merge can't ride
#      along) → Publish. Mark it as a pre-release to publish under the `next`
#      dist-tag.
#
# A Release publishes @xmu-labs/xkg. Up to 1.8.0 every version was also
# published as `mnemos-capture`, the old name; it gets no new versions.
#
# Auth: npm trusted publishing (OIDC), no long-lived token. One-time setup on
# npmjs.com → the package → Settings → Trusted Publisher → GitHub Actions:
# organization xmu-labs, repository xkg, workflow `release.yml`, and under
# Allowed actions tick `npm publish` (without it npm only lets the workflow
# stage a version, and the upload fails with "OIDC permission denied").
# Provenance also requires package.json `repository.url` to name this
# repository. Falls back to an NPM_TOKEN repository secret if trusted
# publishing is not configured.
#
# Fallback when the workflow can't publish: run `scripts/publish.sh` (or
# `scripts/publish.sh next` for a pre-release) by hand from a clean checkout
# of the tagged commit, then re-run the workflow: it sees the version on npm
# with the tagged commit as its gitHead, skips publishing, and still verifies.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      PACKAGES: "@xmu-labs/xkg" # keep in sync with scripts/publish.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      # Every check here guards against one way npm, the tag and main can
      # disagree. Fail before publishing: an npm version can never be reused.
      - name: Verify release matches the repository
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          LOCK_VERSION=$(node -p 'require("./package-lock.json").version')

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::package-lock.json is at $LOCK_VERSION, package.json at $VERSION. Bump with npm version so both move."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points at $(git rev-parse --short HEAD), which is not on main. Merge the version bump first."
            exit 1
          fi
          # Published by hand from this exact commit (the fallback above): the
          # publish script skips that name and the last step confirms the tag
          # and npm agree. A version published from any other commit is still
          # an error.
          for NAME in $PACKAGES; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              PUBLISHED_HEAD=$(npm view "$NAME@$VERSION" gitHead 2>/dev/null || true)
              if [ "$PUBLISHED_HEAD" != "$(git rev-parse HEAD)" ]; then
                echo "::error::$NAME@$VERSION is already on npm from ${PUBLISHED_HEAD:-an unknown commit}. Bump the version."
                exit 1
              fi
              echo "::notice::$NAME@$VERSION was already published from this commit; skipping it."
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # prepublishOnly builds the CLI into dist/cli. Names already published
      # from this commit are skipped.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/publish.sh "$DIST_TAG" --provenance

      # Closes the loop: the published gitHead must be the tagged commit.
      - name: Verify published package
        run: |
          EXPECTED=$(git rev-parse HEAD)
          for NAME in $PACKAGES; do
            # npm can take several minutes to list a new version ("Your
            # package is being processed"); 1.9.0 took more than one.
            GIT_HEAD=""
            for attempt in $(seq 1 30); do
              GIT_HEAD=$(npm view "$NAME@$VERSION" gitHead 2>/dev/null || true)
              [ -n "$GIT_HEAD" ] && break
              sleep 10
            done
            if [ "$GIT_HEAD" != "$EXPECTED" ]; then
              echo "::error::npm reports gitHead '$GIT_HEAD' for $NAME@$VERSION, expected $EXPECTED."
              exit 1
            fi
            # A hand publish defaults to `latest`; a pre-release must not land there.
            TAGGED=$(npm view "$NAME" "dist-tags.$DIST_TAG" 2>/dev/null || true)
            if [ "$TAGGED" != "$VERSION" ]; then
              echo "::error::npm's '$DIST_TAG' tag for $NAME is '$TAGGED', expected $VERSION. Fix with: npm dist-tag add $NAME@$VERSION $DIST_TAG (and move 'latest' back if a pre-release took it)."
              exit 1
            fi
            echo "::notice::$NAME@$VERSION published as '$DIST_TAG' from $EXPECTED."
          done
